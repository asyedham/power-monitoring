---
# Build data as a Jinja dict so the dashboard JSON stays a string. Putting the
# file lookup under YAML `data:` turns `{...}` into an object and the API
# rejects ConfigMap.data (must be string).
- name: Load power monitoring dashboard JSON as ConfigMap data
  ansible.builtin.set_fact:
    grafana_dashboard_data: "{{ {'dashboard-ioscale-power.json': lookup('file', project_root ~ '/grafana/dashboard-ioscale-power.json')} }}"

- name: Check for an existing Grafana deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: grafana
    namespace: "{{ grafana_ns }}"
  register: grafana_deploy
  failed_when: false

- name: Update dashboard only
  when: grafana_deploy.resources | default([]) | length > 0
  block:
    - name: Publish power monitoring dashboard ConfigMap
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-ioscale-dashboard
            namespace: "{{ grafana_ns }}"
          data: "{{ grafana_dashboard_data }}"

- name: Install Grafana from scratch
  when: grafana_deploy.resources | default([]) | length == 0
  block:
    - name: Create Grafana namespace
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ grafana_ns }}"
            labels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/part-of: power-monitoring

    - name: Look up Grafana admin secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: grafana-admin
        namespace: "{{ grafana_ns }}"
      register: grafana_admin_secret

    - name: Generate Grafana admin password
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "-c", "import secrets; print(secrets.token_urlsafe(18))"]
      register: grafana_pw_gen
      changed_when: false
      when:
        - grafana_admin_secret.resources | default([]) | length == 0
        - grafana_admin_password | length == 0

    - name: Store generated Grafana password
      ansible.builtin.set_fact:
        grafana_admin_password: "{{ grafana_pw_gen.stdout }}"
      when:
        - grafana_pw_gen.stdout is defined
        - grafana_pw_gen.stdout | length > 0
        - grafana_admin_password | length == 0

    - name: Create Grafana admin secret
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: "{{ grafana_ns }}"
          type: Opaque
          stringData:
            admin-user: "{{ grafana_admin_user }}"
            admin-password: "{{ grafana_admin_password }}"
      register: grafana_admin_secret_apply
      failed_when: false
      no_log: "{{ not (debug_secrets | bool) }}"
      when: grafana_admin_secret.resources | default([]) | length == 0

    - name: Fail if Grafana admin secret was not created
      ansible.builtin.fail:
        msg: >-
          Failed to create Secret grafana-admin in namespace {{ grafana_ns }}
          (status={{ grafana_admin_secret_apply.status | default('n/a') }}).
          Check that the namespace exists and kubeconfig is valid.
          Re-run with -e debug_secrets=true on a private terminal to see the API error.
      when:
        - grafana_admin_secret.resources | default([]) | length == 0
        - grafana_admin_secret_apply.failed | default(false)

    - name: Show generated Grafana password
      ansible.builtin.debug:
        msg: "Grafana admin password (save this): {{ grafana_admin_password }}"
      when:
        - grafana_admin_secret.resources | default([]) | length == 0
        - grafana_admin_password | length > 0

    - name: Publish power monitoring dashboard ConfigMap
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-ioscale-dashboard
            namespace: "{{ grafana_ns }}"
          data: "{{ grafana_dashboard_data }}"

    - name: Apply Grafana application manifests
      kubernetes.core.k8s:
        state: present
        apply: true
        src: "{{ project_root }}/grafana/grafana-app.yaml"

    - name: Allow Grafana to run as anyuid
      ansible.builtin.command:
        argv: ["oc", "adm", "policy", "add-scc-to-user", "anyuid", "-z", "grafana-sa", "-n", "{{ grafana_ns }}"]
      changed_when: true
      failed_when: false

    - name: Override Grafana image
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: grafana
        namespace: "{{ grafana_ns }}"
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: grafana
                    image: "{{ grafana_image }}"
      when: grafana_image | length > 0

    - name: Wait for Grafana rollout
      ansible.builtin.command:
        argv: ["oc", "rollout", "status", "deploy/grafana", "-n", "{{ grafana_ns }}", "--timeout={{ grafana_wait_timeout }}s"]
      register: grafana_rollout
      changed_when: false
      failed_when: false

- name: Publish Grafana Thanos datasource
  kubernetes.core.k8s:
    state: present
    apply: true
    src: "{{ project_root }}/grafana/datasource.yaml"

- name: Persist Grafana on specified StorageClass
  ansible.builtin.include_tasks: persist.yml

- name: Configure Grafana reverse-proxy URL
  ansible.builtin.include_tasks: proxy.yml

- name: Set Grafana admin password from group_vars
  ansible.builtin.include_tasks: admin.yml

- name: Expose Grafana on hostname:port
  ansible.builtin.include_tasks: portforward.yml

- name: Show Grafana reverse-proxy URL
  ansible.builtin.debug:
    msg: |
      Grafana: {{ grafana_root_url }}
      Dashboard: OpenShift Virt / OpenShift Virtualization Power Monitoring Dashboard
      Login: user {{ grafana_admin_user }} / password {{ grafana_admin_password }}
      (grafana_admin_user and grafana_admin_password in group_vars/all.yml)

      If the URL fails, re-run:
        ansible-playbook ansible/grafana-proxy.yml
