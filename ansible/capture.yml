---
# Sample cluster power into a CSV (Thanos / user-workload Prometheus).
#
#   ansible-playbook ansible/capture.yml -e capture_label=linux-15vm-fio -e capture_duration=1800
#   ansible-playbook ansible/capture.yml -e capture_label=run -e capture_duration=60 -e capture_output=/tmp/power.csv

- name: Capture power time series
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require a finite capture window
      ansible.builtin.assert:
        that:
          - capture_duration | int > 0
        fail_msg: Set -e capture_duration=<seconds> for capture.

    - name: Require oc
      ansible.builtin.command: oc whoami
      changed_when: false

    - name: Capture Kepler platform watts
      power_capture:
        label: "{{ capture_label }}"
        interval: "{{ capture_interval | int }}"
        duration: "{{ capture_duration | int }}"
        output: "{{ capture_output }}"
        kubeconfig: "{{ kubeconfig }}"
        prom_url: "{{ lookup('env', 'PROM_URL') | default('', true) }}"
      register: capture

    - name: Show capture result
      ansible.builtin.debug:
        msg: "{{ capture.msg }}"
